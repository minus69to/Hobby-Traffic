name: pages

# Builds web/ and deploys it to GitHub Pages as a project site
# (https://<owner>.github.io/<repo>/).  One manual step is needed once:
# repository Settings -> Pages -> Source: "GitHub Actions".  GitHub Pages needs a public repository on
# the free plan.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build with the repository name as base path
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Copy the report next to the site
        run: |
          mkdir -p web/dist
          cp docs/report.html web/dist/report.html 2>/dev/null || cp docs/report.md web/dist/report.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
