name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy
      - name: Build networks and demand
        env:
          PYTHONPATH: src
        run: |
          python -m drs.netbuild --config configs/sim.yaml
          python -m drs.demand --config configs/sim.yaml
      - name: Unit tests
        env:
          PYTHONPATH: src
          LIBSUMO_AS_TRACI: "1"
        run: python -m pytest tests -m "not slow and not integration" -q
      - name: Smoke training (2 minutes, small budget)
        env:
          PYTHONPATH: src
          LIBSUMO_AS_TRACI: "1"
        run: timeout 600 python -m drs.train --config configs/train_small.yaml
      - name: Slow tests
        env:
          PYTHONPATH: src
          LIBSUMO_AS_TRACI: "1"
        run: python -m pytest tests -m slow -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
