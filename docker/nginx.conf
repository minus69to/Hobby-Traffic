server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # the site is built with base path /dhaka-rl-signals/
    location /dhaka-rl-signals/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /dhaka-rl-signals/index.html;
    }
    location = / { return 302 /dhaka-rl-signals/; }
    gzip on;
    gzip_types application/json application/javascript text/css;
}
