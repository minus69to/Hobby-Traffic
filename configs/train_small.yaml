# Small-budget run used by `make reproduce` and the CI smoke test (a few minutes on CPU).
sim_config: configs/sim.yaml
network: single
out_dir: models/small
seeds: [13]
total_timesteps: 4096
n_envs: 2
curriculum:
  - {until: 1.0, scenarios: {offpeak: 1.0}}
ppo:
  policy_layers: [64, 64]
  activation: tanh
  n_steps: 256
  batch_size: 64
  n_epochs: 3
  learning_rate: 3.0e-4
  lr_linear_decay: true
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
reward:
  w_wait_delta: 1.0
  w_pressure: 0.2
  w_ped_wait: 0.3
  w_switch: 0.05
eval_every_steps: 2048
eval_episodes: 1
episode_seconds: 600
