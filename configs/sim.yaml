# Simulation configuration. All demand and vehicle parameters are SYNTHETIC ASSUMPTIONS
# inspired by Dhaka traffic; nothing here is measured or validated against real data.
sumo:
  step_length: 1.0          # s, simulation step; decisions are taken every `decision_interval`
  lateral_resolution: 0.8   # m, sublane model so small vehicles weave and share lanes
  lefthand: true            # Bangladesh drives on the left
  episode_seconds: 3600
  warmup_seconds: 300       # excluded from metrics
  decision_interval: 5      # s
  ignore_junction_blocker: 30   # s; vehicles drive past a junction blocker after this long (prevents sublane gridlock)
  pedestrian_jamtime: 60        # s; striping-model pedestrians squeeze through a jam after this long

networks:
  single:
    junctions: ["C"]
    approach_length: 300.0  # m
    lanes_per_approach: 3
    speed_limit: 13.89      # m/s (50 km/h)
    sidewalk_width: 2.5
  grid2x2:
    junctions: ["J00", "J01", "J10", "J11"]
    spacing: 250.0          # m between junctions
    approach_length: 300.0
    lanes_per_approach: 3
    speed_limit: 13.89
    sidewalk_width: 2.5

signal:
  n_phases: 4
  yellow: 3                 # s
  all_red: 2                # s
  min_green: 10             # s
  max_green: 60             # s
  ped_walk_min: 8           # s

# Vehicle classes. Share (percent) of the vehicle mix is an assumption and can be changed here.
# pcu = passenger-car-unit used only for the Webster fixed-time calculation.
vehicle_mix:
  car: 22
  motorcycle: 25
  cng: 20
  rickshaw: 15
  bus: 12
  truck: 6

vtypes:
  car:        {vClass: passenger,  length: 4.3, width: 1.8, maxSpeed: 13.9, accel: 2.4, decel: 4.5, sigma: 0.5, minGapLat: 0.6, latAlignment: arbitrary, lcPushy: 0.5, lcStrategic: 1.0, pcu: 1.0, color: "0.85,0.85,0.9"}
  bus:        {vClass: bus,        length: 11.0, width: 2.5, maxSpeed: 11.1, accel: 1.2, decel: 3.5, sigma: 0.4, minGapLat: 0.8, latAlignment: arbitrary, lcPushy: 0.2, lcStrategic: 1.0, pcu: 2.5, color: "0.2,0.5,0.9"}
  bus_dd:     {vClass: bus,        length: 11.0, width: 2.5, maxSpeed: 10.0, accel: 1.0, decel: 3.5, sigma: 0.4, minGapLat: 0.8, latAlignment: arbitrary, lcPushy: 0.2, lcStrategic: 1.0, pcu: 2.5, color: "0.85,0.1,0.1"}
  truck:      {vClass: truck,      length: 8.5, width: 2.4, maxSpeed: 11.1, accel: 1.0, decel: 3.5, sigma: 0.4, minGapLat: 0.8, latAlignment: arbitrary, lcPushy: 0.1, lcStrategic: 1.0, pcu: 2.0, color: "0.5,0.5,0.4"}
  motorcycle: {vClass: motorcycle, length: 2.0, width: 0.8, maxSpeed: 13.9, accel: 3.0, decel: 5.0, sigma: 0.6, minGapLat: 0.3, latAlignment: arbitrary, lcPushy: 1.0, lcStrategic: 1.0, pcu: 0.4, color: "0.1,0.1,0.1"}
  cng:        {vClass: taxi,       length: 2.7, width: 1.4, maxSpeed: 9.7,  accel: 1.8, decel: 4.0, sigma: 0.6, minGapLat: 0.4, latAlignment: arbitrary, lcPushy: 0.8, lcStrategic: 1.0, pcu: 0.6, color: "0.1,0.6,0.2"}
  rickshaw:   {vClass: moped,      length: 2.4, width: 1.2, maxSpeed: 3.3,  accel: 0.8, decel: 2.0, sigma: 0.7, minGapLat: 0.4, latAlignment: arbitrary, lcPushy: 0.6, lcStrategic: 0.8, pcu: 0.8, color: "0.9,0.6,0.1"}
  pedestrian: {vClass: pedestrian, length: 0.4, width: 0.6, maxSpeed: 1.4, accel: 1.0, decel: 1.0, sigma: 0.0, minGapLat: 0.2, latAlignment: arbitrary, lcPushy: 0.0, lcStrategic: 0.0, pcu: 0.0, color: "0.9,0.8,0.6"}

# Share of buses that are red double-deckers (assumption).
double_decker_share: 0.3

# Demand scenarios: inbound vehicles per hour per arm (all classes together) and turning ratios
# (left, through, right) measured in driving direction.  In a lefthand network the left turn is the
# easy turn.  Pedestrians: persons per hour per crossing.
scenarios:
  offpeak:
    arms: {N: 700, S: 700, E: 650, W: 650}
    turns: [0.2, 0.6, 0.2]
    pedestrians_per_crossing: 120
  morning_peak:
    arms: {N: 1250, S: 900, E: 1100, W: 850}   # heavier inbound (N and E are the "inbound" arms)
    turns: [0.2, 0.6, 0.2]
    pedestrians_per_crossing: 240
  evening_peak:
    arms: {N: 900, S: 1250, E: 850, W: 1100}   # heavier outbound
    turns: [0.2, 0.6, 0.2]
    pedestrians_per_crossing: 240
  incident:
    base: morning_peak
    incident: {edge_suffix: "N", lane: 1, start: 1500, duration: 900, end_pos: 220}
  surge:
    base: morning_peak
    scale: 1.2
  noisy:
    base: morning_peak
    sensor_noise: {gaussian_std: 0.1, dropout: 0.05}

seeds:
  train: [13, 42, 2026, 7, 99, 123, 314, 1000, 2718, 777]
  validation: [5555]
  eval: [10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009, 10010]
  replay: 20260
